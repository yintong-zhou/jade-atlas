# One GitHub call per day; pushing the snapshot to main triggers the Pages build.
name: Refresh GitHub projects

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node frontend/scripts/fetch-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed snapshot
        run: |
          git diff --quiet -- frontend/src/shared/api/githubRepos.json || (git config user.name "github-actions[bot]" && git config user.email "41898341+github-actions[bot]@users.noreply.github.com" && git add frontend/src/shared/api/githubRepos.json && git commit -m "chore: refresh GitHub projects" && git push)
